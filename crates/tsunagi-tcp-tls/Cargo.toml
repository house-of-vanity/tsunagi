[package]
name = "tsunagi-tcp-tls"
version = "1.0.3-rc1"
description = "TCP TLS carrier for independently encrypted tsunagi mesh traffic."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tsunagi-core = { path = "../tsunagi-core", version = "1.0.3-rc1" }
iroh.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
bytes.workspace = true
serde.workspace = true
postcard.workspace = true
tracing.workspace = true
netdev = "0.46"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"

[dev-dependencies]
tsunagi-core = { path = "../tsunagi-core", features = ["testing"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
