[package]
name = "tsunagi-wireguard"
version = "1.0.0"
description = "Independent authenticated WireGuard and Amnezia UDP carriers for tsunagi."
edition.workspace = true
rust-version.workspace = true
license = "WTFPL AND Apache-2.0"
repository.workspace = true

[dependencies]
tsunagi-core = { path = "../tsunagi-core", version = "1.0.0" }
iroh.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
serde.workspace = true
postcard.workspace = true
bytes.workspace = true
tracing.workspace = true
zeroize = { version = "1.9", features = ["derive"] }
rand = "0.10"
chacha20 = "0.9"
boringtun = { version = "0.7.1", default-features = false }
netdev = "0.46"

[dev-dependencies]
tsunagi-core = { path = "../tsunagi-core", features = ["testing"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
